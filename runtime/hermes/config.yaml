model:
  provider: opencode-go
  default: deepseek-v4.1-flash
fallback_providers: []
platform_toolsets:
  cli:
  - skills
  - todo
  - aurora-read
  telegram:
  - skills
  - todo
  - aurora-read
  whatsapp:
  - skills
  - todo
  - aurora-read
agent:
  max_turns: 60
  gateway_timeout: 1800
  restart_drain_timeout: 60
  api_max_retries: 3
  tool_use_enforcement: auto
  task_completion_guidance: true
  parallel_tool_call_guidance: true
  environment_probe: false
  coding_context: 'off'
  reasoning_effort: medium
terminal:
  backend: local
  cwd: /home/aurora
  timeout: 180
  home_mode: auto
display:
  streaming: true
  final_response_markdown: strip
  language: pt
  interim_assistant_messages: false
  tool_progress_command: false
  runtime_footer:
    enabled: false
skills:
  external_dirs: []
  inline_shell: false
  guard_agent_created: true
  write_approval: true
  disabled:
  - airtable
  - apple-notes
  - apple-reminders
  - architecture-diagram
  - arxiv
  - ascii-video
  - baoyu-infographic
  - blocked-page-recovery
  - box
  - claude-code
  - claude-design
  - codebase-inspection
  - codex
  - competitor-news-monitor
  - computer-use
  - design-md
  - document-to-action-items
  - docx
  - dogfood
  - email-inbox-triage
  - findmy
  - gif-search
  - github
  - google-workspace
  - grounded-citations
  - hermes-agent-skill-authoring
  - himalaya
  - humanizer
  - imessage
  - inspecting-hermes-desktop-dom
  - llm-wiki
  - manim-video
  - maps
  - meeting-action-items
  - node-inspect-debugger
  - notion
  - obsidian
  - opencode
  - p5js
  - pdf
  - popular-web-designs
  - powerpoint
  - product-price-monitor
  - python-debugpy
  - requesting-code-review
  - sdlc-review
  - simplify-code
  - songsee
  - songwriting-and-ai-music
  - spike
  - systematic-debugging
  - teams-meeting-pipeline
  - test-driven-development
  - weekly-review-planning
  - xlsx
  - xurl
  - youtube-content
curator:
  enabled: false
hooks_auto_accept: false
sessions:
  auto_prune: false
  retention_days: 90
mcp_servers:
  aurora-read:
    command: /usr/bin/node
    args:
    - /home/aurora/releases/1d5ba55badec19ffc8b4ba04d20117a112fbf48e/runtime/mcp/aurora-read/src/index.mjs
    env:
      AURORA_DB_READ_URL: ${AURORA_DB_READ_URL}
    connect_timeout: 15.0
    enabled: true
